<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Flyovers Playbook</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iI0MwNEQzMiIvPjxlbGxpcHNlIGN4PSIxNiIgY3k9IjE2LjYiIHJ4PSIxMC41IiByeT0iNC42IiBmaWxsPSIjZmZmIi8+PGVsbGlwc2UgY3g9IjE2IiBjeT0iMTUuNCIgcng9IjYuMiIgcnk9IjIuNCIgZmlsbD0iI0MwNEQzMiIvPjwvc3ZnPg==">
<meta name="theme-color" content="#C04D32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --panel-2:#fafbfc; --line:#e5e9ed;
    --ink:#1c2430; --muted:#66727f; --muted-2:#9aa6b2;
    --accent:#c04d32; --accent-ink:#ffffff; --accent-soft:rgba(192,77,50,.14);
    --frisbee:#f5b301;
    --field:#3e7c4a; --field-2:#3a7546; --chalk:#f0f5ee;
    --o:#3d7bed;  --o-ink:#ffffff;   /* aanval = blauw */
    --d:#ef4444;  --d-ink:#ffffff;   /* verdediging = rood */
    --disc:#ffffff;
    --radius:12px;
    --shadow:0 6px 20px rgba(20,30,45,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden}
  button{font-family:inherit; cursor:pointer}
  input,textarea,select{font-family:inherit}

  .app{display:grid; grid-template-columns:264px 1fr; height:100vh; height:100dvh}

  /* Sidebar */
  .sidebar{background:var(--panel-2); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
  .brand{padding:16px 16px 14px; border-bottom:1px solid var(--line)}
  .brand .brand-name{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:22px; letter-spacing:.05em; text-transform:uppercase; line-height:1; color:var(--ink)}
  .brand p{margin:8px 0 0; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .brand .logo-wrap{line-height:0}
  .brand .logo{width:150px; max-width:88%; height:auto; display:block; color:var(--accent)}
  .plays{flex:1; overflow-y:auto; padding:10px 10px 4px}
  .plays-head{display:flex; align-items:center; justify-content:space-between; padding:6px 8px 8px}
  .plays-head span{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2)}
  .play-item{display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent; color:var(--ink); border-radius:10px; padding:10px 12px; margin-bottom:4px; transition:.12s}
  .play-item:hover{background:var(--panel)}
  .play-item.active{background:var(--panel); border-color:var(--line)}
  .play-item .nm{font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px}
  .play-item .meta{font-size:11px; color:var(--muted); margin-top:2px}
  .sig-head{margin-top:8px; padding-top:12px; border-top:1px solid var(--line)}
  .link-item{text-decoration:none}
  .link-item .ext{color:var(--muted-2); font-weight:400}
  .signal-wrap{flex:1; display:none; align-items:center; justify-content:center; padding:16px; min-height:0; min-width:0; background:var(--bg)}
  .signal-wrap img{max-height:100%; max-width:100%; width:auto; height:auto; object-fit:contain}
  .section-signals .field-wrap{display:none}
  .section-signals .signal-wrap{display:flex}
  .section-signals .topbar-right{display:none}
  .play-item.dragging-item{opacity:.4}
  .play-item.drag-over{border-top:2px solid var(--accent)}
  .admin .play-item[draggable="true"]{cursor:grab}
  .tag{font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:2px 6px; border-radius:999px; white-space:nowrap}
  .tag.off{background:rgba(61,123,237,.14); color:#2159c9}
  .tag.def{background:rgba(239,68,68,.13); color:#c0362f}
  .tag.ez{background:rgba(245,179,1,.20); color:#946a00}
  .sidebar-foot{padding:12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:9px 12px; border-radius:10px; font-size:13px; font-weight:500; transition:.12s}
  .btn:hover{border-color:#c9d1d9}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 9px; font-size:12px; border-radius:8px}
  .btn.danger:hover{border-color:var(--d); color:var(--d)}
  .btn[disabled]{opacity:.4; pointer-events:none}
  .btn svg{width:15px; height:15px; display:block}

  /* Main */
  .main{display:flex; flex-direction:column; min-width:0; min-height:0}
  .topbar{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel-2)}
  .topbar-left{display:flex; align-items:center; gap:10px; min-width:0}
  .topbar-center{display:none; justify-content:center; min-width:0}
  .topbar-right{display:flex; align-items:center; gap:10px; justify-content:flex-end; min-width:0}
  .topbar-center .topbar-logo{width:132px; max-width:100%; height:auto; display:block; color:var(--accent)}
  .mode-view .topbar-center{display:flex}
  .mode-view .title-wrap{display:none}
  .menu-btn{display:none}
  .tools-btn{display:none}
  .title-wrap{flex:1; min-width:0}
  .play-name-view{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:22px; letter-spacing:.03em; text-transform:uppercase; line-height:1}
  .play-name-input{background:transparent; border:none; border-bottom:1px dashed var(--line); color:var(--ink); font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:22px; letter-spacing:.03em; text-transform:uppercase; padding:2px 0; width:100%; outline:none}
  .play-name-input:focus{border-bottom-color:var(--accent)}
  .play-desc{font-size:12.5px; color:var(--muted); margin-top:3px}

  .segmented{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:3px}
  .segmented button{border:none; background:transparent; color:var(--muted); padding:6px 12px; border-radius:7px; font-size:12.5px; font-weight:600; letter-spacing:.02em}
  .segmented button.on{background:var(--accent); color:var(--accent-ink)}

  .stage{flex:1; display:flex; min-height:0; position:relative}
  .field-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:18px; min-height:0; min-width:0; background:radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,.04), transparent 60%), var(--bg)}
  svg.field{max-height:100%; max-width:100%; width:auto; height:auto; border-radius:var(--radius); box-shadow:var(--shadow); touch-action:none; user-select:none; -webkit-user-select:none; -moz-user-select:none}

  .player{cursor:default}
  .editing .player{cursor:grab}
  .editing .player.dragging{cursor:grabbing}
  .player.sel .halo{opacity:1}

  .inspector{width:290px; border-left:1px solid var(--line); background:var(--panel-2); padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:14px}
  .insp-block label{display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted-2); margin-bottom:6px}
  .insp-block textarea, .insp-block select{width:100%; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:9px 10px; font-size:13px; outline:none; resize:vertical}
  .insp-block textarea:focus, .insp-block select:focus{border-color:var(--accent)}
  .row{display:flex; gap:8px; flex-wrap:wrap}
  .row .btn{flex:1}
  .hint{font-size:11.5px; color:var(--muted-2); line-height:1.5}
  .insp-divider{height:1px; background:var(--line); margin:0 -14px}

  /* Timeline */
  .timeline{border-top:1px solid var(--line); background:var(--panel-2); padding:12px 18px 14px}
  .steps{display:flex; align-items:center; gap:8px; flex:1; overflow-x:auto; padding-bottom:2px}
  .step-chip{position:relative; flex:0 0 auto; width:42px; height:42px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--muted); font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:19px; display:flex; align-items:center; justify-content:center; transition:.12s}
  .step-chip:hover{border-color:#c9d1d9; color:var(--ink)}
  .step-chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .step-add{flex:0 0 auto; width:42px; height:42px; border-radius:10px; border:1px dashed var(--line); background:transparent; color:var(--muted); font-size:20px; display:flex; align-items:center; justify-content:center}
  .step-add:hover{border-color:var(--accent); color:var(--accent)}
  .step-add[disabled]{opacity:.35; pointer-events:none}
  .step-del:hover{border-color:var(--d); color:var(--d)}
  .icon-btn{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--ink); display:flex; align-items:center; justify-content:center}
  .icon-btn.play{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .icon-btn svg{width:18px; height:18px}
  .icon-btn[disabled]{opacity:.32; pointer-events:none}
  .tl-name{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:18px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink); line-height:1.1; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tl-row{display:flex; align-items:center; gap:14px}
  .tl-text{flex:1; min-width:0}
  .tl-nav{display:flex; align-items:center; gap:8px; flex:0 0 auto}
  .tl-counter{font-family:"Barlow Condensed",sans-serif; font-weight:700; line-height:1; display:flex; align-items:baseline; gap:2px; min-width:26px; justify-content:center}
  .tl-counter .cur{font-size:26px; color:var(--ink)}
  .tl-counter .tot{font-size:14px; color:var(--muted)}
  .tl-note{font-size:13px; color:var(--muted); line-height:1.45; margin-top:4px}
  .tl-note b{color:var(--ink); font-weight:600}
  .steps{margin-top:10px}
  .step-note-input{width:100%; margin-top:8px; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:8px 10px; font-size:13px; outline:none}
  .step-note-input:focus{border-color:var(--accent)}
  .tool.active{border-color:var(--accent); color:var(--accent)}
  .swatches{display:flex; gap:8px}
  .swatch{width:30px; height:30px; border-radius:8px; border:2px solid transparent; background:var(--sw); cursor:pointer; outline:1px solid rgba(0,0,0,.12)}
  .swatch.active{border-color:#fff; box-shadow:0 0 0 2px var(--ink)}
  .field.drawing-tool, .field.drawing-tool .player{cursor:crosshair}
  .opacity-ctl.inactive{opacity:.45}
  .opacity-ctl input[disabled]{cursor:not-allowed}
  .annot-handle.h-pt{cursor:grab}
  .annot-handle.h-tl,.annot-handle.h-br{cursor:nwse-resize}
  .annot-handle.h-tr,.annot-handle.h-bl{cursor:nesw-resize}
  #arrows{pointer-events:none}
  #ezone{pointer-events:none}

  .toggle{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); user-select:none; cursor:pointer}
  .insp-block .toggle{display:inline-flex; text-transform:none; letter-spacing:normal; font-size:12.5px; margin-bottom:0}
  .toggle input{display:none}
  .toggle .track{width:34px; height:20px; border-radius:999px; background:var(--panel); border:1px solid var(--line); position:relative; transition:.12s; flex:0 0 auto}
  .toggle .track::after{content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--muted); transition:.12s}
  .toggle input:checked + .track{background:var(--accent-soft); border-color:var(--accent)}
  .toggle input:checked + .track::after{left:16px; background:var(--accent)}

  .modal-bg{position:fixed; inset:0; background:rgba(20,28,38,.45); display:none; align-items:center; justify-content:center; z-index:40; padding:20px}
  .modal-bg.on{display:flex}
  .modal{width:min(560px,100%); background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
  .modal h3{margin:0; padding:16px 18px; border-bottom:1px solid var(--line); font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:18px; letter-spacing:.04em; text-transform:uppercase}
  .modal .body{padding:16px 18px}
  .modal textarea{width:100%; height:210px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px; font-family:"JetBrains Mono",ui-monospace,monospace; font-size:12px; outline:none; resize:vertical}
  .modal .foot{display:flex; gap:8px; justify-content:flex-end; padding:14px 18px; border-top:1px solid var(--line)}
  .modal .hint{margin-bottom:10px}

  .temp-edit{position:fixed; left:14px; bottom:14px; z-index:60; background:#1c2430; color:#fff; border:1px dashed #f5b301; border-radius:10px; padding:8px 12px; font-size:12.5px; font-weight:600; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .temp-edit:hover{filter:brightness(1.12)}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; transition:.25s; z-index:50; pointer-events:none}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:19}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed; z-index:20; width:280px; height:100%; transform:translateX(-100%); transition:.2s; box-shadow:var(--shadow)}
    .sidebar.open{transform:none}
    .sidebar.open ~ .backdrop{display:block}
    .menu-btn{display:inline-flex}
    .tools-btn.show{display:inline-flex}
    .inspector{position:fixed; right:0; top:0; height:100%; z-index:21; width:260px; transform:translateX(100%); transition:.2s; box-shadow:var(--shadow)}
    .inspector.open{transform:none}
    .topbar{padding:10px 12px; gap:8px}
    .topbar-right{display:none}
    .app.admin:not(.section-signals) .topbar-right{display:flex}
    .topbar-center .topbar-logo{width:112px}
    .field-wrap{padding:10px}
    .timeline{padding:10px 12px 12px}
    .play-name-view,.play-name-input{font-size:19px}
    .play-name-view{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .play-desc{display:none}
  }
  @media (max-width:600px){
    .topbar .toggle .lbl{display:none}
    .segmented button{padding:6px 9px; font-size:12px}
    .tl-counter .cur{font-size:22px}
    .tl-note{font-size:12.5px}
  }
  /* --- Bewerkmenu (icoon-UI) --- */
  .grp{border:1px solid var(--line); border-radius:11px; padding:10px; display:flex; flex-direction:column; gap:8px}
  .gh{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); display:block}
  .gh.fh{margin-bottom:5px}
  .ic{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; flex:0 0 auto}
  .ib{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:9px; cursor:pointer; font-size:12px; font-weight:500; font-family:inherit; transition:.12s}
  .ib.sq{width:36px; height:36px; padding:0; flex:0 0 auto}
  .ib.txt{padding:8px 10px; flex:1}
  .ib:hover{border-color:#c9d1d9}
  .ib[disabled]{opacity:.4; pointer-events:none}
  .ib.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .ib.o{color:var(--o)} .ib.r{color:var(--d)}
  .ib.danger{color:var(--d)} .ib.danger:hover{border-color:var(--d)}
  .actionbar{display:flex; gap:7px; padding:7px; background:var(--panel-2); border:1px solid var(--line); border-radius:11px}
  .actionbar .ib.sq{width:auto; flex:1}
  .tilerow{display:flex; gap:6px; align-items:center}
  .tilerow .ib.sq, .tilerow .sw{flex:1 1 0; min-width:0; width:auto; height:auto; aspect-ratio:1}
  .tilerow .ib .ic{width:24px; height:24px}
  .tilerow .ic{width:22px; height:22px}
  .divider{width:1px; align-self:stretch; background:var(--line); margin:2px 1px; flex:0 0 auto}
  .sw{border-radius:9px; cursor:pointer; outline:1px solid rgba(0,0,0,.12); border:2px solid transparent; background:var(--sw)}
  .sw.active{border-color:#fff; box-shadow:0 0 0 2px var(--ink)}
  .grp select, .grp textarea{width:100%; background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:8px 9px; font-size:12.5px; font-family:inherit; outline:none}
  .grp select:focus, .grp textarea:focus{border-color:var(--accent)}
  .grp textarea{resize:none}
</style>
</head>
<body>

/* State */
let plays = seedPlaybook();
let curPlay = 0, curStep = 0;
let section='plays', sigIdx=0;
let adminUnlocked=false;
function parseHash(){
  const parts=location.hash.replace(/^#/,'').split('&').filter(Boolean);
  adminUnlocked = parts.includes('edit');
  let pl=null, sig=false;
  parts.forEach(t=>{ if(t==='signals') sig=true; const m=t.match(/^play=(\d+)$/); if(m) pl=parseInt(m[1],10); });
  if(sig){ section='signals'; }
  else if(pl!==null){ section='plays'; curPlay=Math.max(0,Math.min(plays.length-1,pl-1)); curStep=0; }
}
function buildHash(){ const p=[]; if(adminUnlocked) p.push('edit'); if(section==='signals') p.push('signals'); else p.push('play='+(curPlay+1)); return '#'+p.join('&'); }
function syncHash(){ try{ const nh=buildHash(); if(location.hash!==nh && window.history && history.replaceState) history.replaceState(null,'',nh); }catch(e){} }
let mode = "view";
function defShown(){ return curPlayObj().showDef!==false; }
let showLines = true;
let selected = null;
let playing = false, animRAF = null;
let history = [];

/* Geometry */
const VB=600, VH=800, MX=46, MTop=40, MBot=48;
const FW=VB-MX*2, FH=VH-MTop-MBot, EZ=0.20;
const nx=x=>MX+x*FW, ny=y=>MTop+y*FH;
const inv=(px,py)=>({x:(px-MX)/FW, y:(py-MTop)/FH});

const svg=document.getElementById('svg');
const SVGNS="http://www.w3.org/2000/svg";
function el(tag,attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function curPlayObj(){ return plays[curPlay]; }

/* Field */
function drawField(){
  const defs=el('defs');
  const grad=el('linearGradient',{id:'turf',x1:0,y1:0,x2:0,y2:1});
  grad.appendChild(el('stop',{offset:0,'stop-color':'#438352'}));
  grad.appendChild(el('stop',{offset:1,'stop-color':'#376e42'}));
  defs.appendChild(grad);
  const lblf=el('filter',{id:'lblsh',x:'-40%',y:'-40%',width:'180%',height:'180%'});
  lblf.appendChild(el('feDropShadow',{dx:0,dy:1.2,stdDeviation:1.2,'flood-color':'#000','flood-opacity':.28}));
  defs.appendChild(lblf);
  [['hatchRed','#ef4444'],['hatchBlue','#3d7bed'],['hatchYel','#f5b301']].forEach(([hid,hc])=>{
    const pat=el('pattern',{id:hid,width:12,height:12,patternUnits:'userSpaceOnUse'});
    pat.appendChild(el('line',{x1:0,y1:12,x2:12,y2:0,stroke:hc,'stroke-width':3}));
    defs.appendChild(pat);
  });
  for(const [id,color] of [['ahO','#6ea0ff'],['ahD','#ff8b84'],['ahDisc','#f5b301'],['adRed','#ef4444'],['adBlue','#3d7bed'],['adYel','#f5b301']]){
    const m=el('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:6.5,markerHeight:6.5,orient:'auto-start-reverse'});

/* Endzone per play: 'bottom' (eigen endzone, start na de pull) | 'top' | 'top-large' (2/5) */
function drawEndzone(){
  const g=document.getElementById('ezone'); g.innerHTML='';
  const mode=curPlayObj().endzone||'bottom';
  const top = (mode==='top' || mode==='top-large');
  const depth = (mode==='top-large') ? 0.40 : 0.20;
  const y0 = top ? 0 : (1-depth);
  const y1 = top ? depth : 1;
  const ry0=ny(y0), ry1=ny(y1);
  g.appendChild(el('rect',{x:MX,y:Math.min(ry0,ry1),width:FW,height:Math.abs(ry1-ry0),fill:'rgba(255,255,255,.07)'}));
  const lineY = top ? ny(depth) : ny(1-depth);
  g.appendChild(el('line',{x1:MX,y1:lineY,x2:MX+FW,y2:lineY,stroke:'var(--chalk)','stroke-width':2.4,opacity:.85}));
  const labY = top ? ny(0)+20 : ny(1)-10;
  const lab=el('text',{x:MX+8,y:labY,fill:'var(--chalk)','font-family':'Barlow Condensed, sans-serif','font-size':15,'letter-spacing':2,opacity:.55});
  lab.textContent='ENDZONE'; g.appendChild(lab);
}

function frameAt(i){ const s=curPlayObj().steps[i]; return {disc:{...s.disc}, offense:s.offense.map(p=>({...p})), defense:s.defense.map(p=>({...p})), labels:(s.labels||[]).map(l=>({...l}))}; }

function lerpFrame(a,b,t){
  const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const mix=(pa,pb)=> pa&&pb?{...pb,x:pa.x+(pb.x-pa.x)*e,y:pa.y+(pb.y-pa.y)*e}:(pb||pa);
  const byId=arr=>Object.fromEntries(arr.map(p=>[p.id,p]));
  const merge=(A,B)=>{ const ids=new Set([...Object.keys(A),...Object.keys(B)]); return [...ids].map(id=>mix(A[id],B[id])); };
  return { disc:mix({...a.disc,id:'disc'},{...b.disc,id:'disc'}),
           offense:merge(byId(a.offense),byId(b.offense)),
           defense:merge(byId(a.defense),byId(b.defense)),
           labels:merge(byId(a.labels||[]),byId(b.labels||[])) };
}

function renderArrows(){
  const g=document.getElementById('arrows'); g.innerHTML='';
  const steps=curPlayObj().steps;
  if(!showLines || playing || curStep>=steps.length-1) return;
  const cur=frameAt(curStep), nxt=frameAt(curStep+1);
  const byId=arr=>Object.fromEntries(arr.map(p=>[p.id,p]));
  const cut=(a,b,color,marker)=>{ if(Math.hypot(b.x-a.x,b.y-a.y)<0.02) return;
    g.appendChild(el('line',{x1:nx(a.x),y1:ny(a.y),x2:nx(b.x),y2:ny(b.y),stroke:color,'stroke-width':2.4,'stroke-dasharray':'1 6','stroke-linecap':'round','marker-end':marker})); };
  const co=byId(cur.offense),no=byId(nxt.offense);
  for(const id in co) if(no[id]) cut(co[id],no[id],'rgba(110,160,255,.95)','url(#ahO)');
  if(defShown()){ const cd=byId(cur.defense),nd=byId(nxt.defense); for(const id in cd) if(nd[id]) cut(cd[id],nd[id],'rgba(255,120,110,.92)','url(#ahD)'); }
  if(cur.disc&&nxt.disc&&Math.hypot(nxt.disc.x-cur.disc.x,nxt.disc.y-cur.disc.y)>0.02)
    g.appendChild(el('line',{x1:nx(cur.disc.x),y1:ny(cur.disc.y),x2:nx(nxt.disc.x),y2:ny(nxt.disc.y),stroke:'var(--frisbee)','stroke-width':2.4,'stroke-dasharray':'1 6','stroke-linecap':'round','marker-end':'url(#ahDisc)'}));
}

/* Handgetekende looplijnen (annotaties per stap) */
const LINE_COLORS={red:'#ef4444',blue:'#3d7bed',yellow:'#f5b301'};
const LINE_TINTS={red:'#fdeceb',blue:'#eef4ff',yellow:'#fdf4dd'};
const LINE_MARKERS={red:'url(#adRed)',blue:'url(#adBlue)',yellow:'url(#adYel)'};
function renderLines(preview){
  const g=document.getElementById('annot'); g.innerHTML='';
  if(playing) return;
  const st=curPlayObj().steps[curStep];
  const HATCH={red:'url(#hatchRed)',blue:'url(#hatchBlue)',yellow:'url(#hatchYel)'};
  const draw=(ln,isPreview)=>{
    const col=LINE_COLORS[ln.color]||'#f5b301';
    const op=(ln.opacity==null?1:ln.opacity);
    const sel=!isPreview && selected && selected.side==='line' && selected.id===ln.id;
    const grp=el('g', isPreview?{}:{class:'annot-item','data-annotid':ln.id});
    if(ln.type==='area'){
      const x=Math.min(ln.x1,ln.x2), y=Math.min(ln.y1,ln.y2), w=Math.abs(ln.x2-ln.x1), hh=Math.abs(ln.y2-ln.y1);
      grp.appendChild(el('rect',{x:nx(x),y:ny(y),width:w*FW,height:hh*FH,fill:HATCH[ln.color]||'url(#hatchYel)',stroke:col,'stroke-width':1.5,opacity:op,'pointer-events':'all'}));
      if(sel){
        grp.appendChild(el('rect',{x:nx(x)-3,y:ny(y)-3,width:w*FW+6,height:hh*FH+6,fill:'none',stroke:'var(--accent)','stroke-width':2,'stroke-dasharray':'5 3','pointer-events':'none'}));
        [['tl',x,y],['tr',x+w,y],['bl',x,y+hh],['br',x+w,y+hh]].forEach(([c,cx,cy])=>{
          grp.appendChild(el('rect',{class:'annot-handle h-'+c,'data-handle':c,x:nx(cx)-5,y:ny(cy)-5,width:10,height:10,rx:2,fill:'#fff',stroke:'var(--accent)','stroke-width':2,'pointer-events':'all'}));
        });
      }
    } else {
      if(Math.hypot(ln.x2-ln.x1,ln.y2-ln.y1)<0.01) return;
      const a={x1:nx(ln.x1),y1:ny(ln.y1),x2:nx(ln.x2),y2:ny(ln.y2),stroke:col,'stroke-width':3,'stroke-linecap':'round',opacity:op};
      if(ln.type==='dashed') a['stroke-dasharray']='2 8'; else a['marker-end']=LINE_MARKERS[ln.color]||'url(#adYel)';
      grp.appendChild(el('line',a));
      if(!isPreview) grp.appendChild(el('line',{x1:nx(ln.x1),y1:ny(ln.y1),x2:nx(ln.x2),y2:ny(ln.y2),stroke:'#000','stroke-opacity':0,'stroke-width':16,'stroke-linecap':'round','pointer-events':'stroke'}));
      if(sel){
        grp.appendChild(el('line',{x1:nx(ln.x1),y1:ny(ln.y1),x2:nx(ln.x2),y2:ny(ln.y2),stroke:'var(--accent)','stroke-width':1.5,'stroke-dasharray':'5 3','pointer-events':'none'}));
        [['p1',ln.x1,ln.y1],['p2',ln.x2,ln.y2]].forEach(([hh2,hx,hy])=>{ grp.appendChild(el('circle',{class:'annot-handle h-pt','data-handle':hh2,cx:nx(hx),cy:ny(hy),r:6,fill:'#fff',stroke:'var(--accent)','stroke-width':2,'pointer-events':'all'})); });
      }
    }
    g.appendChild(grp);
  };
  (st.lines||[]).forEach(ln=>draw(ln,false));
  if(preview) draw(preview,true);
}

/* Animatie: één actie vooruit of achteruit (2x trager) */
const PER_SEG=1440;
function drawMovingLines(interp, to){
  const g=document.getElementById('arrows'); g.innerHTML='';
  if(!showLines) return;
  const byId=arr=>Object.fromEntries(arr.map(p=>[p.id,p]));
  const cut=(a,b,color,marker)=>{ if(Math.hypot(b.x-a.x,b.y-a.y)<0.01) return;
    g.appendChild(el('line',{x1:nx(a.x),y1:ny(a.y),x2:nx(b.x),y2:ny(b.y),stroke:color,'stroke-width':2.4,'stroke-dasharray':'1 6','stroke-linecap':'round','marker-end':marker})); };
  const oNow=byId(interp.offense), oEnd=byId(to.offense);
  for(const id in oNow) if(oEnd[id]) cut(oNow[id],oEnd[id],'rgba(110,160,255,.95)','url(#ahO)');
  if(defShown()){ const dNow=byId(interp.defense), dEnd=byId(to.defense); for(const id in dNow) if(dEnd[id]) cut(dNow[id],dEnd[id],'rgba(255,120,110,.92)','url(#ahD)'); }
  if(interp.disc&&to.disc&&Math.hypot(to.disc.x-interp.disc.x,to.disc.y-interp.disc.y)>0.01)
    g.appendChild(el('line',{x1:nx(interp.disc.x),y1:ny(interp.disc.y),x2:nx(to.disc.x),y2:ny(to.disc.y),stroke:'var(--frisbee)','stroke-width':2.4,'stroke-dasharray':'1 6','stroke-linecap':'round','marker-end':'url(#ahDisc)'}));
}
function animateTo(target){
  const play=curPlayObj();
  if(playing || target<0 || target>play.steps.length-1) return;
  const from=frameAt(curStep), to=frameAt(target);
  playing=true; document.getElementById('annot').innerHTML=''; let start=null;
  function tick(ts){
    if(!playing) return;
    if(start===null) start=ts;
    const t=Math.min((ts-start)/PER_SEG,1);
    const interp=lerpFrame(from,to,t);
    renderFrame(interp);
    drawMovingLines(interp,to);
    if(t>=1){ playing=false; curStep=target; render(); return; }
    animRAF=requestAnimationFrame(tick);
  }
  animRAF=requestAnimationFrame(tick);
}
function nextStep(){ animateTo(curStep+1); }
function prevStep(){ if(playing||curStep===0) return; curStep--; render(); }
function stopPlay(){ playing=false; if(animRAF) cancelAnimationFrame(animRAF); animRAF=null; }
function updateNavButtons(){
  if(section==='signals'){
    document.getElementById('prevBtn').disabled = sigIdx===0;
    document.getElementById('nextBtn').disabled = sigIdx>=signals.length-1;
    return;
  }
  document.getElementById('prevBtn').disabled = curStep===0;
  document.getElementById('nextBtn').disabled = curStep>=curPlayObj().steps.length-1;
}

let tool='move', drawColor='blue', drawOpacity=1, drawing=null;
function clientToNorm(e){ const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const l=pt.matrixTransform(svg.getScreenCTM().inverse()); let {x,y}=inv(l.x,l.y); return {x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y))}; }
svg.addEventListener('pointerdown',e=>{
  if(mode!=='edit') return;
  e.preventDefault();
  if(tool==='move'){
    const hb=e.target.closest('.annot-handle');
    if(hb){
      const grp=hb.closest('.annot-item'); const id=grp&&grp.dataset.annotid; const corner=hb.dataset.handle;
      const item=(curPlayObj().steps[curStep].lines||[]).find(l=>l.id===id);
      if(item){ selected={side:'line',id}; resizeDrag={id,corner,orig:{left:Math.min(item.x1,item.x2),right:Math.max(item.x1,item.x2),top:Math.min(item.y1,item.y2),bottom:Math.max(item.y1,item.y2)}}; pendingSnap=true; svg.setPointerCapture(e.pointerId); }
      return;
    }
    const pg=e.target.closest('.player');
    if(pg){
      const side=pg.dataset.side,id=pg.dataset.id;
      if(side!=='disc') selected={side,id}; else selected=null;
      drag={side,id,g:pg}; pendingSnap=true; pg.classList.add('dragging'); svg.setPointerCapture(e.pointerId); render();
      return;
    }
    const ag=e.target.closest('.annot-item');
    if(ag){
      const id=ag.dataset.annotid;
      selected={side:'line',id};
      const {x,y}=clientToNorm(e);
      const item=(curPlayObj().steps[curStep].lines||[]).find(l=>l.id===id);
      annotDrag={id,downX:x,downY:y,orig:item?{...item}:null};
      pendingSnap=true; svg.setPointerCapture(e.pointerId); render();
      return;
    }
    if(selected){ selected=null; render(); }
  } else {
    const {x,y}=clientToNorm(e);
    drawing={type:tool,color:drawColor,opacity:drawOpacity,x1:x,y1:y,x2:x,y2:y};
    svg.setPointerCapture(e.pointerId);
  }
});
svg.addEventListener('pointermove',e=>{
  if(drag){
    if(pendingSnap){ snapshot(); pendingSnap=false; }
    const {x,y}=clientToNorm(e); const s=curPlayObj().steps[curStep];
    if(drag.side==='disc'){ s.disc.x=x; s.disc.y=y; }
    else if(drag.side==='label'){ if(!s.labels) s.labels=[]; const p=s.labels.find(p=>p.id===drag.id); if(p){p.x=x;p.y=y;} }
    else { const arr=drag.side==='offense'?s.offense:s.defense; const p=arr.find(p=>p.id===drag.id); if(p){p.x=x;p.y=y;} }
    renderFrame(frameAt(curStep));
  } else if(resizeDrag){
    if(pendingSnap){ snapshot(); pendingSnap=false; }
    const {x,y}=clientToNorm(e); const c=resizeDrag.corner;
    const item=(curPlayObj().steps[curStep].lines||[]).find(l=>l.id===resizeDrag.id);
    if(item){
      if(c==='p1'){ item.x1=x; item.y1=y; }
      else if(c==='p2'){ item.x2=x; item.y2=y; }
      else { const o=resizeDrag.orig; const MIN=0.03; let left=o.left,right=o.right,top=o.top,bottom=o.bottom;
        if(c.indexOf('l')>=0) left=Math.min(x,o.right-MIN);
        if(c.indexOf('r')>=0) right=Math.max(x,o.left+MIN);
        if(c.indexOf('t')>=0) top=Math.min(y,o.bottom-MIN);
        if(c.indexOf('b')>=0) bottom=Math.max(y,o.top+MIN);
        item.x1=left; item.y1=top; item.x2=right; item.y2=bottom; }
    }
    renderLines();
  } else if(annotDrag){
    if(pendingSnap){ snapshot(); pendingSnap=false; }
    const {x,y}=clientToNorm(e); const o=annotDrag.orig;
    if(o){
      let dx=x-annotDrag.downX, dy=y-annotDrag.downY;
      const xs=[o.x1,o.x2], ys=[o.y1,o.y2];
      dx=Math.max(-Math.min(...xs), Math.min(dx, 1-Math.max(...xs)));
      dy=Math.max(-Math.min(...ys), Math.min(dy, 1-Math.max(...ys)));
      const item=(curPlayObj().steps[curStep].lines||[]).find(l=>l.id===annotDrag.id);
      if(item){ item.x1=o.x1+dx; item.y1=o.y1+dy; item.x2=o.x2+dx; item.y2=o.y2+dy; }
    }
    renderLines();
  } else if(drawing){
    const {x,y}=clientToNorm(e); drawing.x2=x; drawing.y2=y; renderLines(drawing);
  }
});
function endInteraction(){
  if(drag){ drag.g.classList.remove('dragging'); drag=null; pendingSnap=false; document.getElementById('undoBtn').disabled=history.length===0; renderArrows(); }
  if(annotDrag){ annotDrag=null; pendingSnap=false; document.getElementById('undoBtn').disabled=history.length===0; }
  if(resizeDrag){ resizeDrag=null; pendingSnap=false; document.getElementById('undoBtn').disabled=history.length===0; }
  if(drawing){
    const isArea=drawing.type==='area';
    const ok = isArea ? (Math.abs(drawing.x2-drawing.x1)>0.03 && Math.abs(drawing.y2-drawing.y1)>0.03)
                      : (Math.hypot(drawing.x2-drawing.x1,drawing.y2-drawing.y1)>0.03);
    if(ok){ snapshot(); const st=curPlayObj().steps[curStep]; if(!st.lines) st.lines=[]; st.lines.push({id:'ln'+uid(), ...drawing}); }
    drawing=null; render();
  }
}
svg.addEventListener('pointerup',endInteraction);
svg.addEventListener('pointercancel',endInteraction);

/* Structural edits */
function addStep(){ snapshot(); const play=curPlayObj(); play.steps.splice(curStep+1,0,JSON.parse(JSON.stringify(play.steps[curStep]))); curStep++; stopPlay(); render(); }
function deleteStep(){ const play=curPlayObj(); if(play.steps.length<=1){toast('Een play heeft minstens één stap.');return;} snapshot(); play.steps.splice(curStep,1); curStep=Math.max(0,curStep-1); render(); }
function addPlayer(side){ snapshot(); curPlayObj().steps.forEach(s=>{ const arr=side==='offense'?s.offense:s.defense; const id=(side==='offense'?'o':'d')+uid(); arr.push(P(id,String(arr.length+1),.5,.55)); }); toast(side==='offense'?'Aanvaller toegevoegd':'Verdediger toegevoegd'); render(); }
function addLabel(){ snapshot(); const id='l'+uid(); curPlayObj().steps.forEach(s=>{ if(!s.labels) s.labels=[]; s.labels.push({id,text:'Naam',x:.5,y:.5,size:13,bold:false,italic:false}); }); selected={side:'label',id}; render(); toast('Naam toegevoegd'); }
function deletePlayer(){ if(!selected) return; snapshot(); if(selected.side==='line'){ const st=curPlayObj().steps[curStep]; if(st.lines) st.lines=st.lines.filter(l=>l.id!==selected.id); selected=null; render(); return; } const k=selected.side==='offense'?'offense':selected.side==='defense'?'defense':'labels'; curPlayObj().steps.forEach((s,i)=>{ if(i>=curStep && s[k]) s[k]=s[k].filter(p=>p.id!==selected.id); }); selected=null; render(); }
function newPlay(){ snapshot(); const p={id:uid(),name:"Nieuwe play",category:"offense",endzone:"bottom",description:"",
  steps:[{note:"",disc:{x:.40,y:.80},
    offense:[P("o1","1",.40,.80),P("o2","2",.60,.82),P("o3","3",.50,.42),P("o4","4",.50,.50),P("o5","5",.50,.58),P("o6","6",.50,.66),P("o7","7",.50,.34)],
    defense:[P("d1","1",.44,.85),P("d2","2",.56,.87),P("d3","3",.54,.42),P("d4","4",.54,.50),P("d5","5",.54,.58),P("d6","6",.54,.66),P("d7","7",.50,.28)]}]};
  plays.push(p); curPlay=plays.length-1; curStep=0; mode='edit'; selected=null; stopPlay(); render(); document.getElementById('titleInput').focus(); }
function deletePlay(){ if(plays.length<=1){toast('Je playbook heeft minstens één play nodig.');return;} snapshot(); plays.splice(curPlay,1); curPlay=Math.max(0,curPlay-1); curStep=0; render(); }

/* Wiring */
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; selected=null; tool='move'; drawing=null; stopPlay(); render(); });
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{ tool=b.dataset.tool; updateToolUI(); });
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{ drawColor=b.dataset.color; if(selected&&selected.side==='line'){ snapshot(); const it=(curPlayObj().steps[curStep].lines||[]).find(l=>l.id===selected.id); if(it) it.color=drawColor; render(); } else { updateToolUI(); } });
document.getElementById('nextBtn').onclick=goNext;
document.getElementById('prevBtn').onclick=goPrev;
document.getElementById('linesToggle').onchange=e=>{ showLines=e.target.checked; renderArrows(); };
document.getElementById('defToggle').onchange=e=>{ curPlayObj().showDef=e.target.checked; render(); };
document.getElementById('undoBtn').onclick=undo;
document.getElementById('titleInput').onfocus=()=>snapshot();
document.getElementById('titleInput').oninput=e=>{ curPlayObj().name=e.target.value; document.getElementById('titleView').textContent=e.target.value; };
document.getElementById('descInput').onfocus=()=>snapshot();
document.getElementById('descInput').oninput=e=>{ curPlayObj().description=e.target.value; document.getElementById('playDesc').textContent=e.target.value; };
document.getElementById('catSelect').onchange=e=>{ snapshot(); curPlayObj().category=e.target.value; render(); };
document.getElementById('ezSelect').onchange=e=>{ snapshot(); curPlayObj().endzone=e.target.value; render(); };
document.getElementById('stepNote').onfocus=()=>snapshot();
document.getElementById('stepNote').oninput=e=>{ curPlayObj().steps[curStep].note=e.target.value; };
document.getElementById('addOff').onclick=()=>addPlayer('offense');
document.getElementById('addLabel').onclick=addLabel;
document.getElementById('labelText').onfocus=()=>snapshot();
document.getElementById('labelText').oninput=e=>{ if(!selected||selected.side!=='label') return; curPlayObj().steps.forEach(s=>{ const l=(s.labels||[]).find(p=>p.id===selected.id); if(l) l.text=e.target.value; }); renderFrame(frameAt(curStep)); };
function labelProp(fn){ if(!selected||selected.side!=='label') return; snapshot(); curPlayObj().steps.forEach(s=>{ const l=(s.labels||[]).find(p=>p.id===selected.id); if(l) fn(l); }); }
document.getElementById('labelSize').onchange=e=>{ const v=parseInt(e.target.value,10); labelProp(l=>l.size=v); renderFrame(frameAt(curStep)); };
document.getElementById('labelBold').onclick=()=>{ if(!selected||selected.side!=='label') return; const cur=(curPlayObj().steps[curStep].labels||[]).find(p=>p.id===selected.id); const nv=!(cur&&cur.bold); labelProp(l=>l.bold=nv); render(); };
document.getElementById('labelItalic').onclick=()=>{ if(!selected||selected.side!=='label') return; const cur=(curPlayObj().steps[curStep].labels||[]).find(p=>p.id===selected.id); const nv=!(cur&&cur.italic); labelProp(l=>l.italic=nv); render(); };
let opacityDirty=false;
document.getElementById('lineOpacity').oninput=e=>{ const v=parseFloat(e.target.value); if(selected&&selected.side==='line'){ if(!opacityDirty){ snapshot(); opacityDirty=true; } const it=(curPlayObj().steps[curStep].lines||[]).find(l=>l.id===selected.id); if(it){ it.opacity=v; renderLines(); } } else { drawOpacity=v; } };
document.getElementById('lineOpacity').onchange=()=>{ opacityDirty=false; };
/* TIJDELIJK: verwijder dit blok voor publicatie */
document.getElementById('tempEditBtn').onclick=()=>{ adminUnlocked=true; mode='edit'; render(); document.getElementById('tempEditBtn').style.display='none'; };
document.getElementById('addDef').onclick=()=>addPlayer('defense');
document.getElementById('delPlayer').onclick=deletePlayer;
document.getElementById('delPlay').onclick=deletePlay;
document.getElementById('newPlayBtn').onclick=newPlay;

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ if(mode==='edit'){ e.preventDefault(); undo(); } return; }
  if(/input|textarea|select/.test((e.target.tagName||'').toLowerCase())) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); goNext(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); goPrev(); }
  else if(e.key===' '){ e.preventDefault(); goNext(); }
  else if((e.key==='Delete'||e.key==='Backspace')&&mode==='edit'&&section==='plays'){ if(selected) deletePlayer(); else deleteStep(); }
});

/* Import / export */
const modal=document.getElementById('modal');
function openExport(){ document.getElementById('modalTitle').textContent='Publiceren: plays.json'; document.getElementById('modalHint').textContent='Dit is je volledige playbook. Download het als plays.json en upload dat bestand naar je GitHub-repo (naast index.html) om te publiceren.'; const t=document.getElementById('modalText'); t.value=JSON.stringify(plays,null,2); t.readOnly=true; toggleModalBtns({copy:true,download:true,load:false}); modal.classList.add('on'); }
function openImport(){ document.getElementById('modalTitle').textContent='Importeer playbook'; document.getElementById('modalHint').textContent='Plak hier een eerder geëxporteerd playbook (JSON) en laad het in.'; const t=document.getElementById('modalText'); t.value=''; t.readOnly=false; toggleModalBtns({copy:false,download:false,load:true}); modal.classList.add('on'); }
function toggleModalBtns({copy,download,load}){ document.getElementById('modalCopy').style.display=copy?'inline-flex':'none'; document.getElementById('modalDownload').style.display=download?'inline-flex':'none'; document.getElementById('modalLoad').style.display=load?'inline-flex':'none'; }
document.getElementById('exportBtn').onclick=openExport;
document.getElementById('importBtn').onclick=openImport;
document.getElementById('modalClose').onclick=()=>modal.classList.remove('on');
modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('on'); });
document.getElementById('modalCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(document.getElementById('modalText').value); toast('Gekopieerd naar klembord'); }catch{ toast('Kopiëren niet toegelaten hier'); } };
document.getElementById('modalDownload').onclick=()=>{ const b=new Blob([document.getElementById('modalText').value],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='plays.json'; a.click(); URL.revokeObjectURL(a.href); };
document.getElementById('modalLoad').onclick=()=>{ try{ const d=JSON.parse(document.getElementById('modalText').value); if(!Array.isArray(d)||!d.length) throw new Error(); snapshot(); plays=d; curPlay=0; curStep=0; selected=null; stopPlay(); render(); modal.classList.remove('on'); toast('Playbook geladen'); }catch{ toast('Ongeldige JSON'); } };

/* Mobile panels */
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('toolsBtn').onclick=()=>document.getElementById('inspector').classList.toggle('open');
document.getElementById('backdrop').onclick=closeMobilePanels;
function closeMobilePanels(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('inspector').classList.remove('open'); }

/* Toast */
let toastT=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800); }

drawField();
parseHash(); if(!adminUnlocked) mode='view'; render();
(async function(){ try{ const r=await fetch('plays.json',{cache:'no-store'}); if(r.ok){ const d=await r.json(); if(Array.isArray(d)&&d.length){ plays=d; parseHash(); if(!adminUnlocked) mode='view'; render(); } } }catch(e){} })();
window.addEventListener('hashchange',()=>{ parseHash(); if(!adminUnlocked) mode='view'; selected=null; stopPlay(); render(); });
</script>
