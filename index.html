<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flyovers — binnenkort online</title>
<meta name="description" content="De website van Flyovers Ghent Ultimate is in de maak. Binnenkort vind je hier onze plays, info en meer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#1f6feb;
    --sky-bottom:#7cc0ff;
    --ink:#0a1a2f;
    --paper:#f4f9ff;
    --disc:#ffd23f;
    --disc-edge:#e8a400;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;
    color:var(--paper);
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    position:relative;
  }
  /* subtiel wolkendek onderaan, geen decoratie om de decoratie */
  body::after{
    content:"";
    position:fixed;
    left:0;right:0;bottom:0;
    height:32vh;
    background:radial-gradient(120% 100% at 50% 100%, rgba(255,255,255,.35), transparent 70%);
    pointer-events:none;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8vh 7vw;
    max-width:900px;
  }
  .disc-track{
    position:relative;
    height:80px;
    margin-bottom:clamp(24px,5vh,56px);
  }
  .disc{
    position:absolute;
    top:20px;left:0;
    width:56px;height:22px;
    border-radius:50%;
    background:linear-gradient(180deg,var(--disc) 60%,var(--disc-edge));
    box-shadow:0 10px 18px rgba(10,26,47,.25);
    transform:translateX(-80px) rotate(-8deg);
    animation:glide 2.4s cubic-bezier(.22,.61,.36,1) .3s forwards;
  }
  @keyframes glide{
    0%{transform:translateX(-80px) translateY(30px) rotate(-8deg);opacity:0}
    15%{opacity:1}
    100%{transform:translateX(min(62vw,520px)) translateY(-6px) rotate(6deg);opacity:1}
  }
  h1{
    font-weight:800;
    font-size:clamp(3.2rem,13vw,8rem);
    line-height:.9;
    letter-spacing:-.03em;
    text-shadow:0 2px 0 rgba(10,26,47,.12);
  }
  .tag{
    font-weight:700;
    font-size:clamp(1.1rem,3.4vw,1.7rem);
    margin-top:clamp(18px,3vh,28px);
    max-width:22ch;
    color:#eaf4ff;
  }
  .sub{
    font-weight:500;
    font-size:clamp(1rem,2.6vw,1.2rem);
    margin-top:14px;
    max-width:40ch;
    color:#d7eaff;
  }
  .contact{
    margin-top:clamp(28px,5vh,48px);
    display:inline-flex;
    align-items:center;
    gap:.5em;
    align-self:flex-start;
    background:var(--paper);
    color:var(--ink);
    text-decoration:none;
    font-weight:700;
    font-size:clamp(1rem,2.6vw,1.15rem);
    padding:.75em 1.2em;
    border-radius:999px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 20px rgba(10,26,47,.18);
  }
  .contact:hover,.contact:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 12px 26px rgba(10,26,47,.24);
    outline:none;
  }
  .contact:focus-visible{outline:3px solid var(--disc);outline-offset:3px}
  footer{
    padding:2vh 7vw 4vh;
    font-weight:500;
    font-size:.95rem;
    color:#cfe4ff;
  }
  @media (prefers-reduced-motion:reduce){
    .disc{animation:none;transform:translateX(min(62vw,520px)) rotate(6deg);opacity:1}
  }
</style>
</head>
<body>
  <main>
    <div class="disc-track" aria-hidden="true"><span class="disc"></span></div>
    <h1>Flyovers</h1>
    <p class="tag">Onze nieuwe site vliegt eraan.</p>
    <p class="sub">We bouwen momenteel aan onze plek voor plays, info en alles rond de club. Kom binnenkort terug.</p>
    <a class="contact" href="mailto:info@flyovers.be">Mail ons op info@flyovers.be</a>
  </main>
  <footer>Flyovers Ghent Ultimate · Gent</footer>
</body>
</html>
